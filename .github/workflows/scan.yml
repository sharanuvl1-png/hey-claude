name: Daily stock scan

on:
  schedule:
    - cron: "40 10 * * 1-5"   # 16:10 IST, after the NSE close
  workflow_dispatch:
    inputs:
      refresh:
        description: "Rebuild the automatic watchlist now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: charts-branch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -q yfinance matplotlib pandas numpy

      - name: Scan watchlist and indices
        run: |
          mkdir -p out
          git fetch origin charts 2>/dev/null && git show origin/charts:watchlist_auto.txt > out/watchlist_auto.txt 2>/dev/null || rm -f out/watchlist_auto.txt
          python tools/techchart/screener.py --out out ${{ inputs.refresh == true && '--refresh-watchlist' || '' }} | tee result.txt

      - name: Save to the charts branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin charts 2>/dev/null; then
            git worktree add charts-wt origin/charts
            git -C charts-wt checkout -B charts
          else
            git worktree add --detach charts-wt
            git -C charts-wt checkout --orphan charts
            git -C charts-wt rm -rf . > /dev/null
          fi
          cp -r out/* charts-wt/
          cp "$(tail -1 result.txt)" charts-wt/LATEST_SCAN.md
          git -C charts-wt add -A
          git -C charts-wt commit -m "Daily scan $(date +%F)"
          git -C charts-wt push origin charts
