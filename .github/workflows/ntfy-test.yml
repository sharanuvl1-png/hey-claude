name: Phone alert test

# Sends one test push to the ntfy app, so you can check alerts reach your phone.
# Run it any time from the Actions tab ("Phone alert test" → Run workflow).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ntfy-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Send a test alert
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::The NTFY_TOPIC secret is not set (Settings → Secrets and variables → Actions → Repository secrets)."
            exit 1
          fi
          curl -fsS -H "Title: Swing board test alert" -H "Tags: white_check_mark" \
            -d "Phone alerts work. You'll get a push when one of your holdings closes below support or at its stop." \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          echo "Test alert sent."
