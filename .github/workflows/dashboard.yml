name: Nifty 100 swing board

on:
  schedule:
    - cron: "0 3 * * 1-5"     # 08:30 IST, before the open: overnight global markets, India VIX and news
    - cron: "45 5 * * 1-5"    # 11:15 IST
    - cron: "15 8 * * 1-5"    # 13:45 IST
    - cron: "50 10 * * 1-5"   # 16:20 IST, after the NSE close
    # Back-up starts. GitHub's timer often starts scheduled runs late or skips them, so each scan has
    # two spare starts at off-peak minutes; the "gate" job below lets only the first one through.
    - cron: "27 3 * * 1-5"    # 08:57 IST
    - cron: "7 6 * * 1-5"     # 11:37 IST
    - cron: "31 6 * * 1-5"    # 12:01 IST
    - cron: "37 8 * * 1-5"    # 14:07 IST
    - cron: "3 9 * * 1-5"     # 14:33 IST
    - cron: "13 11 * * 1-5"   # 16:43 IST
    - cron: "41 11 * * 1-5"   # 17:11 IST
  workflow_dispatch:
  # Pull requests that change the board run a real scan as a check, without publishing.
  pull_request:
    paths:
      - "tools/techchart/**"
      - "travel/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: write   # saves each scan's calls to the swing-history branch (track record, what changed)
  pages: write
  id-token: write

concurrency:
  group: swing-board
  cancel-in-progress: false

jobs:
  # Scheduled starts only: skip when a scan was already saved in the last 75 minutes (the back-up
  # starts above, or a late start of the same slot). Manual runs and pull requests always go ahead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/swing-history | cut -f1)
            if [ -n "$last" ]; then
              when=$(curl -fsS -H "Authorization: Bearer ${{ github.token }}" \
                "https://api.github.com/repos/${{ github.repository }}/commits/$last" | python3 -c "import json,sys,datetime as d; print(int(d.datetime.fromisoformat(json.load(sys.stdin)['commit']['committer']['date'].replace('Z','+00:00')).timestamp()))" || echo 0)
              age=$(( $(date +%s) - when ))
              echo "Last saved scan was $((age / 60)) minutes ago."
              [ "$age" -lt 4500 ] && run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Run the scan: $run"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -q yfinance matplotlib pandas numpy

      - name: Analyse every Nifty 100 stock
        run: |
          # Last good index list from the breakout watch, used if the index site is down.
          git fetch --depth=1 origin breakouts 2>/dev/null && git show origin/breakouts:nifty100.txt > nifty100.txt 2>/dev/null || rm -f nifty100.txt
          # Past calls, for the track record and "what changed since the last scan".
          mkdir -p hist
          git fetch -q --depth=1 origin swing-history 2>/dev/null && git show origin/swing-history:history.json > hist/history.json 2>/dev/null || rm -f hist/history.json
          python tools/techchart/dashboard.py --out site --cache nifty100.txt --history hist/history.json --alerts alerts.json
        env:
          WATCHLIST: ${{ secrets.WATCHLIST }}

      - name: Check the data against a fresh download (stops a bad scan from going live)
        run: python tools/techchart/validate.py site/data.json

      - name: Save the calls to the swing-history branch
        if: github.event_name != 'pull_request'
        run: |
          # One commit, replaced each run, so the branch stays small.
          cd hist
          git init -q -b swing-history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -q -m "Swing board calls $(TZ=Asia/Kolkata date '+%F %H:%M IST')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" swing-history

      - name: Watchlist alerts to the ntfy app (optional, needs the NTFY_TOPIC and WATCHLIST secrets)
        if: github.event_name != 'pull_request' && env.NTFY_TOPIC != ''
        run: |
          python -c "import json,os,sys; sys.path.insert(0,'tools/techchart'); import breakouts as b; a=json.load(open('alerts.json')) if os.path.exists('alerts.json') else []; print(len(a),'alert(s)'); a and b.ntfy(os.environ['NTFY_TOPIC'], a)"

      - name: Keep the old /travel/ link working (Ghumakkad moved to its own repo)
        run: cp -r travel site/travel

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
