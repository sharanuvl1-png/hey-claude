name: Technical chart

on:
  workflow_dispatch:
    inputs:
      stock:
        description: "Company name or NSE symbol (e.g. PC Jeweller or PCJEWELLER.NS)"
        required: true

permissions:
  contents: read

concurrency:
  group: charts-branch
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -q yfinance matplotlib pandas numpy

      - name: Time-to-target estimate
        run: python tools/techchart/timeline.py HDFCBANK.NS:1047.7,1157.1 RELIANCE.NS:1604.1,1830.5
