name: Build app

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/chart.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download offline speech model
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          echo "small-en-us-0.15" > app/src/main/assets/model-en-us/uuid

      - name: Show which wake word sounds the model knows
        run: |
          M=app/src/main/assets/model-en-us
          find $M -type f | sed "s|$M/||"
          WORDS=$(find $M -name "words.txt" | head -1)
          echo "word list: ${WORDS:-none}"
          if [ -n "$WORDS" ]; then
            for w in hi hey hello me may hit heat eat a mehta meta mahita mehitha; do
              if cut -d' ' -f1 "$WORDS" | grep -qx "$w"; then echo "known: $w"; else echo "UNKNOWN: $w"; fi
            done
          fi

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk hey-claude.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hey-claude
          path: hey-claude.apk

      - name: Publish as a release for easy phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hi Mehitha build ${{ github.run_number }}
          files: hey-claude.apk
          make_latest: true
