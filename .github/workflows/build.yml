name: Build app

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/chart.yml"
      - ".github/workflows/scan.yml"
      - ".github/workflows/wakecheck.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download offline speech model
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          echo "small-en-us-0.15" > app/src/main/assets/model-en-us/uuid

      - name: Show which wake word sounds the model knows
        run: |
          M=app/src/main/assets/model-en-us
          find $M -type f | sed "s|$M/||"
          WORDS=$(find $M -name "words.txt" | head -1)
          echo "word list: ${WORDS:-none}"
          if [ -n "$WORDS" ]; then
            for w in hi hey hello me may hit heat eat a mehta meta mahita mehitha; do
              if cut -d' ' -f1 "$WORDS" | grep -qx "$w"; then echo "known: $w"; else echo "UNKNOWN: $w"; fi
            done
          fi

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testVoiceDebugUnitTest --no-daemon 2>&1 | tee tests.log

      - name: Save test results to the charts branch
        if: always()
        run: |
          python3 tools/tests_summary.py app/build/test-results/testVoiceDebugUnitTest tests.log > TESTS.txt || true
          cat TESTS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin charts
          git worktree add charts-wt origin/charts
          git -C charts-wt checkout -B charts
          cp TESTS.txt charts-wt/TESTS.txt
          git -C charts-wt add -A
          git -C charts-wt commit -m "Tests: $(head -1 TESTS.txt)" || true
          git -C charts-wt push origin charts || true
          git worktree remove --force charts-wt

      - name: Stop if a test failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build APKs
        run: gradle :app:assembleCoreDebug :app:assembleVoiceDebug :app:assembleFullDebug --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/core/debug/app-core-debug.apk hey-claude.apk
          cp app/build/outputs/apk/voice/debug/app-voice-debug.apk hey-claude-voice.apk
          cp app/build/outputs/apk/full/debug/app-full-debug.apk hey-claude-full.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hey-claude
          path: |
            hey-claude.apk
            hey-claude-voice.apk
            hey-claude-full.apk

      - name: Publish as a release for easy phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hi Mehitha build ${{ github.run_number }}
          files: |
            hey-claude.apk
            hey-claude-voice.apk
            hey-claude-full.apk
          make_latest: true
