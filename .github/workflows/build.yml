name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download offline speech model
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          echo "small-en-us-0.15" > app/src/main/assets/model-en-us/uuid

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk hey-claude.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hey-claude
          path: hey-claude.apk

      - name: Publish as a release for easy phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hey Claude build ${{ github.run_number }}
          files: hey-claude.apk
          make_latest: true
