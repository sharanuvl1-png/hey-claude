name: Build app

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/chart.yml"
      - ".github/workflows/scan.yml"
      - ".github/workflows/breakouts.yml"
      - ".github/workflows/backtest.yml"
  # Pull requests get the tests and the APKs (as a workflow artifact) but no release.
  pull_request:
    paths-ignore:
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testVoiceDebugUnitTest :app:testFullDebugUnitTest --continue --no-daemon 2>&1 | tee tests.log

      - name: Save test results to the charts branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          python3 tools/tests_summary.py app/build/test-results/testVoiceDebugUnitTest tests.log > TESTS.txt || true
          cat TESTS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin charts
          git worktree add charts-wt origin/charts
          git -C charts-wt checkout -B charts
          cp TESTS.txt charts-wt/TESTS.txt
          git -C charts-wt add -A
          git -C charts-wt commit -m "Tests: $(head -1 TESTS.txt)" || true
          git -C charts-wt push origin charts || true
          git worktree remove --force charts-wt

      - name: Stop if a test failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build APKs
        run: gradle :app:assembleCoreDebug :app:assembleVoiceDebug :app:assembleFullDebug --no-daemon

      - name: Rename APKs
        run: |
          # The build number is in each file name, so you can tell versions apart on the phone.
          n=${{ github.run_number }}
          cp app/build/outputs/apk/core/debug/app-core-debug.apk hey-claude-build$n.apk
          cp app/build/outputs/apk/voice/debug/app-voice-debug.apk hey-claude-voice-build$n.apk
          cp app/build/outputs/apk/full/debug/app-full-debug.apk hey-claude-full-build$n.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hey-claude
          path: |
            hey-claude-build${{ github.run_number }}.apk
            hey-claude-voice-build${{ github.run_number }}.apk
            hey-claude-full-build${{ github.run_number }}.apk

      - name: Publish as a release for easy phone download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hi Mehitha build ${{ github.run_number }}
          files: |
            hey-claude-build${{ github.run_number }}.apk
            hey-claude-voice-build${{ github.run_number }}.apk
            hey-claude-full-build${{ github.run_number }}.apk
          make_latest: true
