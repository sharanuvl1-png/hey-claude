name: Wake word check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charts-branch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng sox > /dev/null
          pip install -q vosk
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
      - name: Run check
        run: python tools/wakecheck/check.py vosk-model-small-en-us-0.15 | tee wakecheck.txt
      - name: Save the result where it can be read back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin charts
          git worktree add charts-wt origin/charts
          git -C charts-wt checkout -B charts
          cp wakecheck.txt charts-wt/WAKECHECK.txt
          git -C charts-wt add -A
          git -C charts-wt commit -m "Wake check: $(tail -1 wakecheck.txt)"
          git -C charts-wt push origin charts

      - uses: actions/upload-artifact@v4
        with:
          name: wakecheck
          path: wakecheck.txt
