name: My holdings check

on:
  schedule:
    - cron: "45 4-9 * * 1-5"   # hourly, 10:15 to 15:15 IST
    - cron: "50 10 * * 1-5"    # 16:20 IST, after the NSE close
  workflow_dispatch:
    inputs:
      stocks:
        description: "Stocks to check, comma-separated (leave empty to use the PORTFOLIO secret)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: portfolio-branch
  cancel-in-progress: false

jobs:
  holdings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -q yfinance matplotlib pandas numpy

      - name: Analyse each holding
        env:
          # Only stock names: keep quantities and buy prices out of this public repository.
          PORTFOLIO: ${{ inputs.stocks != '' && inputs.stocks || secrets.PORTFOLIO }}
        run: python tools/techchart/portfolio.py --out out

      - name: Save to the portfolio branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin portfolio 2>/dev/null; then
            git worktree add pf-wt origin/portfolio
            git -C pf-wt checkout -B portfolio
          else
            git worktree add --detach pf-wt
            git -C pf-wt checkout --orphan portfolio
            git -C pf-wt rm -rf . > /dev/null
          fi
          # Keep only the latest check: the branch always holds today's state.
          git -C pf-wt rm -rq --ignore-unmatch . > /dev/null
          cp -r out/* pf-wt/
          git -C pf-wt add -A
          git -C pf-wt commit -m "Holdings check $(TZ=Asia/Kolkata date '+%F %H:%M')" || echo "No changes"
          git -C pf-wt push origin portfolio
